# =========================================================
# 会社情報AI調査ツール 設定ファイル
# =========================================================

ai:
  # 使用するAIプロバイダ: openai / gemini / claude のいずれかを指定
  provider: claude

  openai:
    api_key: "YOUR_OPENAI_API_KEY"
    model: "gpt-4o"
    temperature: 0.0

  gemini:
    api_key: "YOUR_GEMINI_API_KEY"
    model: "gemini-3.6-flash"

  claude:
    api_key: "YOUR_CLAUDE_API_KEY"
    model: "claude-sonnet-5"
    max_tokens: 4096
    # web_search / web_fetch を1回の呼び出しで実行できる最大回数。
    # 小さすぎるとSNSアカウントの個別検索まで手が回らず
    # 「サイトは見つかったがSNSはnull」になりやすい。
    web_search_max_uses: 8
    # 公式サイトを実際に取得(フェッチ)してフッター等のSNSリンクを
    # 確認するかどうか。ブラウザ版の挙動に近づけるため既定でtrue。
    # (Anthropic APIのbeta機能。SDK/APIが未対応の場合は自動的に
    #  web_searchのみにフォールバックする)
    enable_web_fetch: true

# 1回のプロンプトで処理する会社件数
# Claudeで複数SNSを個別に確認させる場合、1社あたりの検索予算を
# 確保するため、件数を小さめ(1〜3件程度)にすることを推奨する。
batch:
  size: 2

# AIに送信するプロンプトの雛形
# {company_list} には調査対象の会社一覧(1行1社)が展開される
prompt:
  template: |
    あなたは企業情報調査の専門家です。
    以下の企業リストについて、それぞれの公式ホームページURL、公式メールアドレス、
    Instagram公式アカウント、Facebook公式アカウント、LINE公式アカウントを、
    Web上の最新情報を必ず確認したうえで調査してください。

    各社について、必ず次の手順で調査してください。
    1. 会社名・住所・電話番号でWeb検索し、公式ホームページを特定する。
    2. 特定した公式ホームページを実際に開き(取得し)、フッター・ヘッダー・
       会社概要ページ・お問い合わせページ・アクセスページ・お知らせ/
       ブログページ等、複数ページを確認する。
    3. SNSへのリンクがアイコンボタンや画像リンクになっており、画面上の
       テキストとしてURLが見えない場合でも、そのリンク・画像がどの
       URLに遷移するか(リンク先/href)を必ず確認すること。表示テキスト
       にURLが無いことと、遷移先URLが存在しないことは別である。
       遷移先URLがInstagram/Facebook/LINE等のドメインであれば、
       それを公式アカウントの情報として採用してよい。
    4. 公式サイト内でSNSリンクが見つからない、または公式サイト自体が
       見つからない場合は、"<会社名> Instagram"、"<会社名> Facebook"の
       ように、SNSごとに個別にWeb検索を行い、公式アカウントの有無を
       確認する。1回の検索で見つからなくても、店舗名の表記ゆれ
       (略称・カタカナ表記・英語表記)や、運営元の法人名・グループ名
       (公式サイトの会社概要等に記載があれば、そのグループブランド名
       も含む)でも再検索すること。
    5. 個人アカウント、無関係な同名アカウント、まとめサイトやポータル
       サイトに掲載された情報のみを根拠にしないこと。必ず該当企業の
       公式アカウントであることを、プロフィール文や外部リンク等から
       確認できたもののみを採用する。
    6. 上記の手順を尽くしても確認できなかった項目のみ null とする
       (未確認のまま推測で埋めないこと)。

    調査対象企業リスト:
    {company_list}

    出力は必ず以下のJSON配列形式のみで返してください。
    説明文や前置き、```などのコードブロック記号は一切付けないでください。
    情報が確認できなかった項目は必ず null にしてください(推測で埋めないこと)。

    [
      {{
        "company_name": "会社名(入力と同一の文字列)",
        "address": "住所(入力と同一の文字列)",
        "phone": "電話番号(入力と同一の文字列)",
        "website_url": "公式ホームページURLまたはnull",
        "email": "公式メールアドレスまたはnull",
        "instagram": "Instagram公式アカウントURLまたはnull",
        "facebook": "Facebook公式アカウントURLまたはnull",
        "line": "LINE公式アカウントURLまたはnull"
      }}
    ]

# ログ出力設定
logging:
  log_file: "logs/app.log"
  console_level: "INFO"
  file_level: "DEBUG"

# 初回調査でメールアドレス/Instagram/Facebook/LINEのいずれかが
# 取得できなかった会社について、1社ずつより粘り強く再調査するかどうか。
# APIコール数は増えるが、初回の判断が「保守的すぎて見送った」ケースを
# 拾い直すことができる。
followup:
  enabled: true
  # 未確認項目を再調査する際のプロンプト雛形。
  # {company_name}/{address}/{phone}/{missing_fields} を展開する。
  template: |
    先ほどの初回調査で、以下の企業について一部の項目が未確認でした。
    より粘り強く、下記のポイントに沿って再調査してください。

    会社名: {company_name}
    住所: {address}
    電話番号: {phone}
    未確認の項目: {missing_fields}

    再調査のポイント:
    1. 公式ホームページを取得(フェッチ)した際、SNSへのリンクが
       アイコンボタンや画像リンクであっても、そのリンク・画像自体の
       遷移先URL(href)を必ず確認すること。画面上に表示されている
       テキストにURLが無くても、リンク先URLは別途保持されている
       ことが多い。遷移先が対象SNSのドメインであれば採用してよい。
    2. トップページだけでなく、会社概要・アクセス・お問い合わせ・
       お知らせ・ブログ等、複数のページを確認すること。
    3. 公式サイトに運営法人名やグループブランド名の記載があれば、
       その名称でも個別にWeb検索を行うこと。
    4. 会社名の表記ゆれ(略称・カタカナ表記・英語表記)を変えて、
       最低2〜3パターンは検索を試すこと。
    5. 個人アカウントや無関係な同名アカウント、まとめサイトの情報を
       根拠にしないこと。
    6. それでも確認できない場合のみ null とすること(推測で埋めない)。

    出力は以下のJSON形式のみで返してください。
    説明文や前置き、```などのコードブロック記号は一切付けないでください。

    {{
      "company_name": "{company_name}",
      "email": "確認できた場合のみ値、それ以外はnull",
      "instagram": "確認できた場合のみ値、それ以外はnull",
      "facebook": "確認できた場合のみ値、それ以外はnull",
      "line": "確認できた場合のみ値、それ以外はnull"
    }}

