[LLM]
; provider: "claude", "chatgpt" (または "openai"), "gemini" から選択
; provider = gemini
; api_key = YOUR_GEMINI_API_KEY
; model = gemini-3.6-flash

provider = claude
api_key = YOUR_CLAUDE_API_KEY
model = claude-sonnet-5

[SETTINGS]
; 1回のAPI呼び出し（プロンプト）で処理する会社情報の件数
batch_size = 1

[PROMPT]
; {companies_data} の部分にTSVから読み込んだデータ(JSON配列)が動的に埋め込まれます
template = 以下の会社リストについて、Web検索等を用いて「公式ホームページURL」「公式メールアドレス」「Instagram公式アカウント」「Facebook公式アカウント」「Line公式アカウント」を特定してください。
  
  【入力データ】
  {companies_data}
  
  【厳守事項】
  1. 必ず入力データの件数（要素数）と同じ要素数のJSON配列(リスト)のみを出力してください。
  2. 会社が存在しない場合や情報が一切見つからない場合でも、絶対にスキップしたり解説テキストを出力したりせず、すべてのキーの値を null に設定したオブジェクトを返してください。
  3. レスポンスは JSON 配列のみとし、前後に解説文、挨拶、Markdownのマークアップ等のテキストを一切含めないでください。
  4. 取得したWebページの応答確認ができない場合は「未取得」扱いとしてください。

  【出力形式フォーマット】
  [
  {{
      "company_name": "入力された会社名",
      "official_website": "URL または null",
      "official_email": "メールアドレス または null",
      "instagram": "Instagram URL または null",
      "facebook": "Facebook URL または null",
      "line": "LINE URL または null"
  }}
  ]
